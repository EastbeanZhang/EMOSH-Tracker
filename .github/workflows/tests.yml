name: CPU checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.23.5 scipy==1.10.1 opencv-python-headless==4.10.0.84 Pillow==10.4.0 imageio==2.37.0 imageio-ffmpeg==0.6.0 roma==1.5.4 einops==0.8.1 -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
